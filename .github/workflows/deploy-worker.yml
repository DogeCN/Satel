name: Deploy Worker

# 协调端是可选组件：只有 server/ 变了才触发，且需要仓库 Secrets。
# 客户端的构建与测试在 ci.yml 里，与本 workflow 无关。

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 校验 Secrets 已配置
        run: |
          set -euo pipefail
          missing=0
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::缺少 Secret CLOUDFLARE_API_TOKEN"; missing=1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::缺少 Secret CLOUDFLARE_ACCOUNT_ID"; missing=1; }
          [ "$missing" -eq 0 ] || { echo "在仓库 Settings → Secrets 里补齐后重跑"; exit 1; }

      - name: 测试
        working-directory: server
        run: |
          set -euo pipefail
          npm ci
          npm test

      - name: 校验跨语言帧契约
        run: bash scripts/gen-golden.sh

      - name: 应用 D1 migration
        working-directory: server
        run: npx --yes wrangler@4 d1 migrations apply satel --remote

      - name: 部署
        working-directory: server
        run: npx --yes wrangler@4 deploy

      - name: 冒烟（可选）
        env:
          PASSWORD: ${{ secrets.PASSWORD }}
          WORKER_URL: ${{ vars.WORKER_URL }}
        run: |
          set -euo pipefail
          if [ -z "$PASSWORD" ] || [ -z "$WORKER_URL" ]; then
            echo "未配置 Secret PASSWORD 或 Variable WORKER_URL，跳过冒烟"
            exit 0
          fi
          cd client
          # 客户端自己会取 ECH 配置、签名、发 HELLO——这是对部署最真实的检验。
          go run ./cmd/satel probe --handshake --timeout 15s \
            --worker "$WORKER_URL" --password "$PASSWORD" www.baidu.com || \
            echo "::warning::冒烟未通过（协调端可能尚未绑定自定义域名）"
