<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Satel">
  <title>Satel</title>

  <!-- 纯黑扁平侧视卫星。所有部件沿一条自左下到右上的轴线排布、彼此相接；
       越靠近观察者越大、越远越小，单一剪影读起来是一台卫星而不是零件堆。 -->

  <!-- 远端太阳翼：贴住本体右缘，窄而短 -->
  <path d="M82 50 L120 41 L120 61 L82 58 Z"/>

  <!-- 星体：柱体，横跨画面中部 -->
  <path d="M44 46 h36 a9 9 0 0 1 9 9 v12 a9 9 0 0 1 -9 9 h-36 z"/>

  <!-- 近端太阳翼：贴住本体左缘，宽而长 -->
  <path d="M4 60 L44 50 L44 80 L4 76 Z"/>

  <!-- 天线碟：从本体左端伸出并上翘，与近端翼分离 -->
  <path d="M44 50 L30 32 a5 5 0 0 0 -5 8 L42 60 Z"/>
</svg>
