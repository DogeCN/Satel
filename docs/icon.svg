<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Satel">
  <title>Satel</title>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f6fc"/>
      <stop offset="1" stop-color="#a8bbd6"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d80e8"/>
      <stop offset="1" stop-color="#1c3f80"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="28" fill="#0d1526"/>

  <!-- 轨道：卫星绕封锁边界飞 -->
  <path d="M20 100a52 52 0 0 1 30-63" fill="none" stroke="#4d84d8"
        stroke-width="3.5" stroke-linecap="round" stroke-dasharray="2 9" opacity="0.9"/>
  <circle cx="20" cy="100" r="4" fill="#5b9bff"/>

  <!-- 太阳翼：粗壮，小尺寸下仍清晰 -->
  <g fill="url(#panel)">
    <rect x="12" y="58" width="26" height="20" rx="3"/>
    <rect x="90" y="58" width="26" height="20" rx="3"/>
  </g>
  <g fill="#0d1b33" opacity="0.55">
    <rect x="21" y="58" width="2.6" height="20"/>
    <rect x="31" y="58" width="2.6" height="20"/>
    <rect x="99" y="58" width="2.6" height="20"/>
    <rect x="109" y="58" width="2.6" height="20"/>
  </g>

  <!-- 星体 -->
  <rect x="42" y="52" width="44" height="32" rx="8" fill="url(#body)"/>

  <!-- 发射机：从星体右上角射出的波，代表加密后绕行 -->
  <g fill="none" stroke="#5b9bff" stroke-linecap="round">
    <path d="M78 48a11 11 0 0 1 11 11" stroke-width="5"/>
    <path d="M86 38a22 22 0 0 1 22 22" stroke-width="5" opacity="0.62"/>
  </g>
  <circle cx="75" cy="45" r="4.5" fill="#5b9bff"/>

  <rect x="1.5" y="1.5" width="125" height="125" rx="27" fill="none" stroke="#2b4468" stroke-width="3"/>
</svg>
