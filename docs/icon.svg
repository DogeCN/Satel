<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Satel">
  <title>Satel</title>

  <!-- 纯黑扁平侧视卫星：太阳翼近大远小，无渐变、无描边、无装饰 -->

  <!-- 远端太阳翼（右上，透视缩小） -->
  <path d="M98 44 L124 37 L124 59 L98 57 Z"/>

  <!-- 远端连杆 -->
  <rect x="86" y="48" width="14" height="5" rx="2.5"/>

  <!-- 星体（侧视：柱体，正面朝左） -->
  <path d="M48 42 h26 a10 10 0 0 1 10 10 v14 a10 10 0 0 1 -10 10 h-26 z"/>

  <!-- 近端连杆 -->
  <rect x="34" y="58" width="16" height="7" rx="3.5"/>

  <!-- 近端太阳翼（左下，透视放大） -->
  <path d="M4 62 L32 54 L32 84 L4 80 Z"/>

  <!-- 天线碟：从本体左端伸出并上翘，明显离开近端翼 -->
  <path d="M48 46 L33 30 a5 5 0 0 0 -5 8 L46 56 Z"/>
</svg>
